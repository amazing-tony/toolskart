            </nav>
            <h1>BMI Calculator</h1>
            <p class="tool-description">Calculate your Body Mass Index easily.</p>

            <div class="bmi-box">
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btnMetric" onclick="setUnit('metric')">Metric (kg/cm)</button>
                    <button class="toggle-btn" id="btnImperial" onclick="setUnit('imperial')">Imperial (lb/ft+in)</button>
                </div>

                <div id="metricInputs">
                    <div class="input-group">
                        <label for="heightCm">Height (cm)</label>
                        <input type="number" id="heightCm" placeholder="e.g. 175" step="0.1">
                    </div>
                    <div class="input-group">
                        <label for="weightKg">Weight (kg)</label>
                        <input type="number" id="weightKg" placeholder="e.g. 70" step="0.1">
                    </div>
                </div>

                <div id="imperialInputs">
                    <div class="input-row">
                        <div class="input-group">
                            <label for="heightFt">Height (ft)</label>
                            <input type="number" id="heightFt" placeholder="e.g. 5">
                        </div>
                        <div class="input-group">
                            <label for="heightIn">Height (in)</label>
                            <input type="number" id="heightIn" placeholder="e.g. 9">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="weightLb">Weight (lbs)</label>
                        <input type="number" id="weightLb" placeholder="e.g. 150" step="0.1">
                    </div>
                </div>

                <button class="btn-calc" onclick="calculateBMI()">Calculate BMI</button>

                <div class="result-box" id="resultBox">
                    <div class="bmi-number" id="bmiResult">0.0</div>
                    <div class="bmi-category" id="bmiCategory">Category</div>
                    <p id="bmiDesc">Description</p>
                    <div class="scale-bar">
                        <div class="scale-pointer" id="scalePointer" style="left: 0%;"></div>
                    </div>
                </div>

                <p class="health-note">BMI is a screening tool, not a diagnostic measure. Consult a healthcare provider.</p>
            </div>
        </div>
    </main>

    <script>
        let unit = 'metric';
        function setUnit(u) {
            unit = u;
            document.getElementById('btnMetric').classList.toggle('active', u === 'metric');
            document.getElementById('btnImperial').classList.toggle('active', u === 'imperial');
            document.getElementById('metricInputs').style.display = u === 'metric' ? 'block' : 'none';
            document.getElementById('imperialInputs').style.display = u === 'imperial' ? 'block' : 'none';
        }
        function calculateBMI() {
            let bmi = 0;
            if (unit === 'metric') {
                const h = parseFloat(document.getElementById('heightCm').value) / 100;
                const w = parseFloat(document.getElementById('weightKg').value);
                if (!h || !w) return alert('Please enter valid values');
                bmi = w / (h * h);
            } else {
                const ft = parseFloat(document.getElementById('heightFt').value) || 0;
                const inches = parseFloat(document.getElementById('heightIn').value) || 0;
                const w = parseFloat(document.getElementById('weightLb').value);
                const totalInches = (ft * 12) + inches;
                if (!totalInches || !w) return alert('Please enter valid values');
                bmi = (w / (totalInches * totalInches)) * 703;
            }
            displayResult(bmi);
        }
        function displayResult(bmi) {
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('bmiResult').textContent = bmi.toFixed(1);
            let category = '', desc = '', cls = '', pct = 0;
            if (bmi < 18.5) { category = 'Underweight'; cls = 'cat-underweight'; pct = (bmi / 18.5) * 18.5; desc = 'You are underweight.'; }
            else if (bmi < 25) { category = 'Normal'; cls = 'cat-normal'; pct = 18.5 + ((bmi - 18.5)/6.5)*6.5; desc = 'You have a normal body weight. Good job!'; }
            else if (bmi < 30) { category = 'Overweight'; cls = 'cat-overweight'; pct = 25 + ((bmi - 25)/5)*5; desc = 'You are slightly overweight.'; }
            else if (bmi < 40) { category = 'Obese'; cls = 'cat-obese'; pct = 30 + ((bmi - 30)/10)*10; desc = 'You are in the obese category.'; }
            else { category = 'Severely Obese'; cls = 'cat-severely-obese'; pct = 40 + Math.min((bmi - 40)/20, 1)*60; desc = 'You are severely obese.'; }
            
            const catElem = document.getElementById('bmiCategory');
            catElem.textContent = category;
            catElem.className = 'bmi-category ' + cls;
            document.getElementById('bmiDesc').textContent = desc;
            document.getElementById('scalePointer').style.left = Math.min(Math.max(pct, 0), 100) + '%';
        }
    </script>
